<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reader Poll</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ====================================================================
     CONFIG — paste your Supabase values here (Project Settings -> API)
     ==================================================================== */
  /* handled in JS below */

  /* Warm Neutral — design tokens */
  :root{
    --ink-950:#1A1714; --ink-900:#2A2622; --ink-800:#3B362F; --ink-700:#524C43;
    --ink-600:#6B6459; --ink-500:#8A8276; --ink-400:#ABA398; --ink-300:#C9C2B8;
    --ink-200:#E2DCD2; --ink-100:#EFEAE2; --ink-50:#F8F5EF; --paper:#FCFAF6; --white:#FFFFFF;
    --accent:#C2763C; --accent-soft:#E9D4BF;

    --surface:var(--white); --text:var(--ink-900); --text-soft:var(--ink-600);
    --text-mute:var(--ink-500); --border:var(--ink-200); --border-soft:var(--ink-100);

    --font-display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    --font-body:'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', monospace;

    --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-full:999px;
    --shadow-sm:0 1px 2px rgba(42,38,34,.06), 0 1px 3px rgba(42,38,34,.05);
    --shadow-md:0 4px 12px rgba(42,38,34,.07), 0 2px 4px rgba(42,38,34,.05);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:var(--font-body);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    line-height:1.5;
  }

  .poll{
    max-width:520px;
    margin:0 auto;
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px 24px 16px;
    background:var(--surface);
    box-shadow:var(--shadow-sm);
  }

  /* eyebrow row */
  .meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    font-size:.8125rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-mute);
    font-weight:600;
  }
  .live{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:.78rem;letter-spacing:.02em;text-transform:none;color:var(--text-soft);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-500);position:relative;}
  .dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--ink-500);opacity:.3;animation:pulse 2s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.6);opacity:.45;}100%{transform:scale(2.4);opacity:0;}}

  .question{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.5rem;
    line-height:1.15;
    margin:15px 0 18px;
    letter-spacing:-.02em;
    color:var(--ink-950);
  }

  .options{display:flex;flex-direction:column;gap:9px;}

  /* an option as a button (pre-vote) and as a result row (post-vote) share a base */
  .opt{
    position:relative;
    width:100%;
    text-align:left;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    background:var(--surface);
    color:var(--text);
    font-family:var(--font-body);
    font-size:.9375rem;
    font-weight:500;
    padding:12px 15px;
    cursor:pointer;
    overflow:hidden;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--ink-300);background:var(--ink-50);}
  .opt:focus-visible{outline:none;border-color:var(--ink-700);box-shadow:0 0 0 3px var(--ink-100);}
  .opt:disabled{cursor:default;}

  /* result mode */
  .opt .fill{
    position:absolute;inset:0;
    width:0%;
    background:var(--ink-100);
    z-index:0;
    transition:width .6s cubic-bezier(.22,.61,.36,1);
  }
  .opt.leading:not(.mine) .fill{background:var(--ink-200);}
  .opt.mine{border-color:var(--accent-soft);}
  .opt.mine .fill{background:var(--accent-soft);}
  .opt .row{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .opt .label{display:flex;align-items:center;gap:9px;min-width:0;}
  .opt .label .text{overflow:hidden;text-overflow:ellipsis;}
  .tag{
    display:inline-flex;align-items:center;
    font-family:var(--font-body);font-size:.6875rem;font-weight:600;letter-spacing:.02em;
    color:var(--ink-800);background:var(--accent-soft);
    border-radius:var(--radius-full);padding:2px 9px;white-space:nowrap;
  }
  .pct{font-family:var(--font-mono);font-weight:600;font-size:.875rem;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text-soft);}
  .opt.mine .pct{color:var(--accent);}
  .opt.leading .pct{color:var(--text);}
  .opt.leading:not(.mine) .label .text{font-weight:700;}

  .results-mode .opt{cursor:pointer;}

  .foot{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:16px;padding-top:12px;border-top:1px solid var(--border-soft);
    font-size:.75rem;color:var(--text-mute);
  }
  .foot .hint{font-family:var(--font-mono);letter-spacing:.01em;}
  .foot-right{display:flex;align-items:center;gap:10px;}
  .create-link{font-family:var(--font-body);font-size:.75rem;color:var(--text-mute);text-decoration:none;font-weight:600;white-space:nowrap;}
  .create-link:hover{color:var(--text);text-decoration:underline;}
  .create-link:focus-visible{outline:2px solid var(--ink-700);outline-offset:2px;border-radius:3px;}

  .msg{font-size:.9375rem;color:var(--text-soft);padding:6px 0;}
  .err{color:var(--accent);}

  /* skeleton */
  .sk{background:linear-gradient(90deg,var(--ink-100) 25%,var(--ink-50) 50%,var(--ink-100) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--radius-sm);}
  @keyframes sh{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  @media (prefers-reduced-motion: reduce){
    .opt .fill{transition:none;}
    .dot::after{animation:none;}
    .sk{animation:none;}
  }
</style>
</head>
<body>
  <div class="poll" id="poll" role="group" aria-label="Reader poll">
    <div class="meta">
      <span id="eyebrow">Reader poll</span>
      <span class="live"><span class="dot" style="visibility:hidden" id="dot"></span><span id="count">&nbsp;</span></span>
    </div>
    <div id="body">
      <div class="sk" style="height:24px;width:80%;margin:14px 0 18px"></div>
      <div class="sk" style="height:42px;margin-bottom:8px"></div>
      <div class="sk" style="height:42px;margin-bottom:8px"></div>
      <div class="sk" style="height:42px"></div>
    </div>
    <div class="foot">
      <span class="hint" id="hint">Resets daily at midnight PT</span>
      <span class="foot-right">
        <span class="hint" id="status"></span>
        <a class="create-link" href="https://trbaker.github.io/polls/create.html" target="_blank" rel="noopener">Create a poll</a>
      </span>
    </div>
  </div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ======================================================================
   1) CONFIG — paste your Supabase Project URL and anon (publishable) key.
      Find them in: Supabase Dashboard -> Project Settings -> API.
      The anon/publishable key is safe to ship in client code.
   ====================================================================== */
const SUPABASE_URL = 'https://zjngzjcrbfdtcvokdvyx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_50nNXhHcse4RZ_VgewI1Qw_5NOK4HmG';

/* ====================================================================== */

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const REFRESH_MS = 20000;

// --- persistent per-browser voter token (one identity, survives reloads) ---
function getVoterToken(){
  let t;
  try { t = localStorage.getItem('rp_voter_token'); } catch(_){}
  if(!t){
    t = (crypto.randomUUID && crypto.randomUUID()) ||
        ('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
          const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16);}));
    try { localStorage.setItem('rp_voter_token', t); } catch(_){}
  }
  return t;
}

// --- decode the poll definition from ?p=<base64url(JSON)> ---
function decodePoll(){
  const raw = new URLSearchParams(location.search).get('p');
  if(!raw) throw new Error('No poll data in the link.');
  let json;
  try{
    const b64 = raw.replace(/-/g,'+').replace(/_/g,'/');
    const pad = b64 + '==='.slice((b64.length + 3) % 4);
    json = decodeURIComponent(escape(atob(pad)));
  }catch(_){ throw new Error('This poll link looks corrupted.'); }
  const def = JSON.parse(json);
  if(!def || !def.i || !def.q || !Array.isArray(def.o)) throw new Error('This poll link is incomplete.');
  if(def.o.length < 3 || def.o.length > 6) throw new Error('A poll needs 3 to 6 options.');
  return { id:String(def.i), question:String(def.q), options:def.o.map(String) };
}

// --- iframe auto-height for embedders that listen for it ---
function postHeight(){
  try{ parent.postMessage({ type:'pollwidget:height', height: document.documentElement.scrollHeight }, '*'); }catch(_){}
}

let poll, token, voted = false, myChoice = null, busy = false;

function render(results){
  const counts = (results && results.counts) || {};
  const total  = (results && results.total) || 0;
  let max = -1;
  poll.options.forEach((_,i)=>{ const n = counts[i]||0; if(n>max) max=n; });

  const body = $('body');
  body.className = voted ? 'results-mode' : '';
  body.innerHTML = '';

  const q = document.createElement('div');
  q.className='question'; q.textContent = poll.question;
  body.appendChild(q);

  const wrap = document.createElement('div'); wrap.className='options';
  poll.options.forEach((label, i)=>{
    const n = counts[i]||0;
    const pct = total>0 ? Math.round((n/total)*100) : 0;
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.type='button';
    btn.disabled = busy;
    if(voted){
      if(i===myChoice) btn.classList.add('mine');
      if(n===max && max>0) btn.classList.add('leading');
      btn.setAttribute('aria-label', `${label}: ${pct}% (${n} ${n===1?'vote':'votes'})`);
      btn.innerHTML =
        `<span class="fill"></span>`+
        `<span class="row"><span class="label"><span class="text">${esc(label)}</span>`+
        `${i===myChoice?'<span class="tag">Your vote</span>':''}</span>`+
        `<span class="pct">${pct}%</span></span>`;
      requestAnimationFrame(()=>{ btn.querySelector('.fill').style.width = pct+'%'; });
    } else {
      btn.innerHTML = `<span class="row"><span class="label"><span class="text">${esc(label)}</span></span></span>`;
    }
    btn.addEventListener('click', ()=>vote(i));
    wrap.appendChild(btn);
  });
  body.appendChild(wrap);

  $('dot').style.visibility = 'visible';
  $('count').textContent = `${total} ${total===1?'vote':'votes'} today`;
  $('eyebrow').textContent = voted ? 'Live results' : 'Reader poll';
  postHeight();
}

function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function vote(i){
  if(busy) return;
  if(voted && i===myChoice) return; // already on this choice
  busy = true; $('status').textContent = 'Saving…';
  // optimistic UI: lock buttons
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const { data, error } = await supabase.rpc('cast_vote', {
    p_poll_id: poll.id, p_voter_token: token,
    p_option_index: i, p_num_options: poll.options.length
  });
  busy = false;
  if(error){
    $('status').textContent = 'Could not save — tap to retry';
    document.querySelectorAll('.opt').forEach(b=>b.disabled=false);
    return;
  }
  voted = true; myChoice = i; $('status').textContent = '';
  render(data);
}

async function refresh(){
  if(document.hidden) return;
  const { data, error } = await supabase.rpc('get_results', { p_poll_id: poll.id });
  if(!error && data) render(data);
}

async function init(){
  try{
    poll = decodePoll();
    token = getVoterToken();
  }catch(e){
    $('body').innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
    $('dot').style.visibility='hidden'; postHeight(); return;
  }
  if(SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_KEY.includes('YOUR-ANON')){
    $('body').innerHTML = `<div class="msg err">Widget not configured: set SUPABASE_URL and SUPABASE_KEY in index.html.</div>`;
    postHeight(); return;
  }
  await refresh();              // show the question + current tally
  setInterval(refresh, REFRESH_MS);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });
}

init();
window.addEventListener('load', postHeight);
</script>
</body>
</html>
